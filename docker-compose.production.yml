services:
  aistor:
    image: quay.io/minio/aistor/minio:latest
    pull_policy: always
    command: server /mnt/data --console-address ":9001" --license /run/secrets/aistor_license
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/root_password
    ports:
      - "${AISTOR_API_PORT:-9000}:9000"
      - "${AISTOR_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${AISTOR_DATA_DIR:-./docker/aistor/production/data}:/mnt/data
      - ${AISTOR_CERTS_DIR:-./docker/aistor/production/certs}:/etc/minio/certs
      - ${AISTOR_LICENSE_FILE:-./docker/aistor/production/secrets/minio.license}:/run/secrets/aistor_license:ro
      - ${AISTOR_ROOT_USER_FILE:-./docker/aistor/production/secrets/root_user}:/run/secrets/root_user:ro
      - ${AISTOR_ROOT_PASSWORD_FILE:-./docker/aistor/production/secrets/root_password}:/run/secrets/root_password:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - nuvia_beauty_net

  aistor-setup:
    image: quay.io/minio/aistor/mc:latest
    pull_policy: always
    depends_on:
      aistor:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://aistor:9000 "$$(cat /run/secrets/root_user)" "$$(cat /run/secrets/root_password)" &&
        mc mb --ignore-existing local/${AISTOR_BUCKET:-nuvia-public} &&
        mc anonymous set download local/${AISTOR_BUCKET:-nuvia-public}
    volumes:
      - ${AISTOR_ROOT_USER_FILE:-./docker/aistor/production/secrets/root_user}:/run/secrets/root_user:ro
      - ${AISTOR_ROOT_PASSWORD_FILE:-./docker/aistor/production/secrets/root_password}:/run/secrets/root_password:ro
    restart: "no"
    networks:
      - nuvia_beauty_net

  backend:
    pull_policy: always
    depends_on:
      aistor:
        condition: service_healthy
      aistor-setup:
        condition: service_completed_successfully
    environment:
      FILESYSTEM_DISK: s3
      FILESYSTEM_CLOUD: s3
      MEDIA_DISK: s3
      IMPORT_FILESYSTEM_DISK: s3
      AISTOR_REGION: ${AISTOR_REGION:-us-east-1}
      AISTOR_BUCKET: ${AISTOR_BUCKET:-nuvia-public}
      AISTOR_ENDPOINT: http://aistor:9000
      AISTOR_PUBLIC_URL: ${AISTOR_PUBLIC_URL:-http://localhost:9000/${AISTOR_BUCKET:-nuvia-public}}
      AISTOR_USE_PATH_STYLE_ENDPOINT: "true"
      AISTOR_BUCKET_ENDPOINT: "false"
    command:
      - /bin/sh
      - -c
      - >
        export AISTOR_ACCESS_KEY_ID="$$(cat /run/secrets/root_user)";
        export AISTOR_SECRET_ACCESS_KEY="$$(cat /run/secrets/root_password)";
        php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - ${AISTOR_ROOT_USER_FILE:-./docker/aistor/production/secrets/root_user}:/run/secrets/root_user:ro
      - ${AISTOR_ROOT_PASSWORD_FILE:-./docker/aistor/production/secrets/root_password}:/run/secrets/root_password:ro
    networks:
      - nuvia_beauty_net

  admin:
    pull_policy: always
    networks:
      - nuvia_beauty_net

  vendor:
    pull_policy: always
    networks:
      - nuvia_beauty_net

  storefront:
    pull_policy: always
    networks:
      - nuvia_beauty_net

networks:
  nuvia_beauty_net:
    name: nuvia-beauty-net
