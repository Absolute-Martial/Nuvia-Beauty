name: nuvia-beauty

x-backend-env: &backend_env
  APP_NAME: Nuvia Beauty
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:?APP_URL is required}
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  DB_CONNECTION: ${DB_CONNECTION:-mysql}
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-nuvia_beauty}
  DB_USERNAME: ${DB_USERNAME:-nuvia_beauty}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  CACHE_DRIVER: ${CACHE_DRIVER:-file}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
  SESSION_DRIVER: ${SESSION_DRIVER:-file}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
  ADMIN_URL: ${ADMIN_URL:?ADMIN_URL is required}
  VENDOR_URL: ${VENDOR_URL:?VENDOR_URL is required}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-s3_compatible}
  S3_PROVIDER: ${S3_PROVIDER:-minio_aistor}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://aistor:9000}
  S3_REGION: ${S3_REGION:-${AISTOR_REGION:-us-east-1}}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${AISTOR_ACCESS_KEY_ID:-}}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${AISTOR_SECRET_ACCESS_KEY:-}}
  S3_USE_PATH_STYLE_ENDPOINT: ${S3_USE_PATH_STYLE_ENDPOINT:-${AISTOR_USE_PATH_STYLE_ENDPOINT:-true}}
  S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-${AISTOR_BUCKET:-nuvia-public}}
  S3_BEAUTY_INPUTS_BUCKET: ${S3_BEAUTY_INPUTS_BUCKET:-nuvia-private-beauty-inputs}
  S3_BEAUTY_RESULTS_BUCKET: ${S3_BEAUTY_RESULTS_BUCKET:-nuvia-private-beauty-results}
  S3_BEAUTY_CALIBRATION_BUCKET: ${S3_BEAUTY_CALIBRATION_BUCKET:-nuvia-private-calibration}
  S3_UPLOAD_URL_TTL_MINUTES: ${S3_UPLOAD_URL_TTL_MINUTES:-15}
  S3_DOWNLOAD_URL_TTL_MINUTES: ${S3_DOWNLOAD_URL_TTL_MINUTES:-60}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-s3}
  FILESYSTEM_CLOUD: ${FILESYSTEM_CLOUD:-s3}
  IMPORT_FILESYSTEM_DISK: ${IMPORT_FILESYSTEM_DISK:-s3}
  MEDIA_DISK: ${MEDIA_DISK:-s3}
  AISTOR_REGION: ${AISTOR_REGION:-us-east-1}
  AISTOR_BUCKET: ${AISTOR_BUCKET:-nuvia-public}
  AISTOR_PUBLIC_URL: ${AISTOR_PUBLIC_URL:?AISTOR_PUBLIC_URL is required}
  AISTOR_ENDPOINT: ${AISTOR_ENDPOINT:-http://aistor:9000}
  AISTOR_USE_PATH_STYLE_ENDPOINT: ${AISTOR_USE_PATH_STYLE_ENDPOINT:-true}
  AISTOR_BUCKET_ENDPOINT: ${AISTOR_BUCKET_ENDPOINT:-false}
  AISTOR_ROOT_PREFIX: ${AISTOR_ROOT_PREFIX:-}

x-default-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nuvia_beauty}
      MYSQL_USER: ${DB_USERNAME:-nuvia_beauty}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - nuvia_beauty_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "${DB_USERNAME:-nuvia_beauty}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nuvia_beauty_net

  aistor:
    image: quay.io/minio/aistor/minio:latest
    pull_policy: always
    command: server /mnt/data --console-address ":9001" --license /run/secrets/aistor_license
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/root_password
    ports:
      - "${AISTOR_API_PORT:-9000}:9000"
      - "${AISTOR_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${AISTOR_DATA_DIR:?AISTOR_DATA_DIR is required}:/mnt/data
      - ${AISTOR_CERTS_DIR:?AISTOR_CERTS_DIR is required}:/etc/minio/certs
      - ${AISTOR_LICENSE_FILE:?AISTOR_LICENSE_FILE is required}:/run/secrets/aistor_license:ro
      - ${AISTOR_ROOT_USER_FILE:?AISTOR_ROOT_USER_FILE is required}:/run/secrets/root_user:ro
      - ${AISTOR_ROOT_PASSWORD_FILE:?AISTOR_ROOT_PASSWORD_FILE is required}:/run/secrets/root_password:ro
    networks:
      - nuvia_beauty_net

  aistor-setup:
    image: quay.io/minio/aistor/mc:latest
    pull_policy: always
    depends_on:
      aistor:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://aistor:9000 "$$(cat /run/secrets/root_user)" "$$(cat /run/secrets/root_password)"; do sleep 2; done &&
        mc mb --ignore-existing local/${S3_PUBLIC_BUCKET:-${AISTOR_BUCKET:-nuvia-public}} &&
        mc mb --ignore-existing local/${S3_BEAUTY_INPUTS_BUCKET:-nuvia-private-beauty-inputs} &&
        mc mb --ignore-existing local/${S3_BEAUTY_RESULTS_BUCKET:-nuvia-private-beauty-results} &&
        mc mb --ignore-existing local/${S3_BEAUTY_CALIBRATION_BUCKET:-nuvia-private-calibration} &&
        mc anonymous set download local/${S3_PUBLIC_BUCKET:-${AISTOR_BUCKET:-nuvia-public}}
    volumes:
      - ${AISTOR_ROOT_USER_FILE:?AISTOR_ROOT_USER_FILE is required}:/run/secrets/root_user:ro
      - ${AISTOR_ROOT_PASSWORD_FILE:?AISTOR_ROOT_PASSWORD_FILE is required}:/run/secrets/root_password:ro
    restart: "no"
    networks:
      - nuvia_beauty_net

  backend-init:
    image: ${NUVIA_BACKEND_IMAGE:?NUVIA_BACKEND_IMAGE is required}
    pull_policy: always
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      aistor:
        condition: service_started
      aistor-setup:
        condition: service_completed_successfully
    environment:
      <<: *backend_env
    command:
      - /bin/sh
      - -c
      - >
        export CACHE_DRIVER=file;
        export SESSION_DRIVER=file;
        export QUEUE_CONNECTION=sync;
        export S3_ACCESS_KEY_ID="$$(cat /run/secrets/root_user)";
        export S3_SECRET_ACCESS_KEY="$$(cat /run/secrets/root_password)";
        export AISTOR_ACCESS_KEY_ID="$$(cat /run/secrets/root_user)";
        export AISTOR_SECRET_ACCESS_KEY="$$(cat /run/secrets/root_password)";
        php artisan migrate --force &&
        php artisan db:seed --class='\Marvel\Database\Seeders\SettingsSeeder' --force
    volumes:
      - ${AISTOR_ROOT_USER_FILE:?AISTOR_ROOT_USER_FILE is required}:/run/secrets/root_user:ro
      - ${AISTOR_ROOT_PASSWORD_FILE:?AISTOR_ROOT_PASSWORD_FILE is required}:/run/secrets/root_password:ro
    networks:
      - nuvia_beauty_net

  backend:
    image: ${NUVIA_BACKEND_IMAGE:?NUVIA_BACKEND_IMAGE is required}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      aistor:
        condition: service_started
      aistor-setup:
        condition: service_completed_successfully
      backend-init:
        condition: service_completed_successfully
    environment:
      <<: *backend_env
    command:
      - /bin/sh
      - -c
      - >
        export CACHE_DRIVER=file;
        export SESSION_DRIVER=file;
        export QUEUE_CONNECTION=sync;
        export S3_ACCESS_KEY_ID="$$(cat /run/secrets/root_user)";
        export S3_SECRET_ACCESS_KEY="$$(cat /run/secrets/root_password)";
        export AISTOR_ACCESS_KEY_ID="$$(cat /run/secrets/root_user)";
        export AISTOR_SECRET_ACCESS_KEY="$$(cat /run/secrets/root_password)";
        php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - ${AISTOR_ROOT_USER_FILE:?AISTOR_ROOT_USER_FILE is required}:/run/secrets/root_user:ro
      - ${AISTOR_ROOT_PASSWORD_FILE:?AISTOR_ROOT_PASSWORD_FILE is required}:/run/secrets/root_password:ro
    ports:
      - "8000:8000"
    networks:
      - nuvia_beauty_net

  admin:
    image: ${NUVIA_ADMIN_IMAGE:?NUVIA_ADMIN_IMAGE is required}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      INTERNAL_REST_API_ENDPOINT: http://backend:8000
      NEXT_PUBLIC_REST_API_ENDPOINT: ${NEXT_PUBLIC_REST_API_ENDPOINT:?NEXT_PUBLIC_REST_API_ENDPOINT is required}
      NEXT_PUBLIC_SHOP_URL: ${NEXT_PUBLIC_SHOP_URL:?NEXT_PUBLIC_SHOP_URL is required}
      NEXT_PUBLIC_VENDOR_URL: ${NEXT_PUBLIC_VENDOR_URL:?NEXT_PUBLIC_VENDOR_URL is required}
    ports:
      - "3002:3002"
    networks:
      - nuvia_beauty_net

  vendor:
    image: ${NUVIA_VENDOR_IMAGE:?NUVIA_VENDOR_IMAGE is required}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      INTERNAL_REST_API_ENDPOINT: http://backend:8000
      NEXT_PUBLIC_REST_API_ENDPOINT: ${NEXT_PUBLIC_REST_API_ENDPOINT:?NEXT_PUBLIC_REST_API_ENDPOINT is required}
      NEXT_PUBLIC_SHOP_URL: ${NEXT_PUBLIC_SHOP_URL:?NEXT_PUBLIC_SHOP_URL is required}
      NEXT_PUBLIC_VENDOR_URL: ${NEXT_PUBLIC_VENDOR_URL:?NEXT_PUBLIC_VENDOR_URL is required}
    ports:
      - "3004:3004"
    networks:
      - nuvia_beauty_net

  storefront:
    image: ${NUVIA_STOREFRONT_IMAGE:?NUVIA_STOREFRONT_IMAGE is required}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      INTERNAL_REST_API_ENDPOINT: http://backend:8000
      NEXT_PUBLIC_REST_API_ENDPOINT: ${NEXT_PUBLIC_REST_API_ENDPOINT:?NEXT_PUBLIC_REST_API_ENDPOINT is required}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
    ports:
      - "3003:3003"
    networks:
      - nuvia_beauty_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    logging: *default_logging
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    command:
      - tunnel
      - --no-autoupdate
      - run
    networks:
      - nuvia_beauty_net
      - dokploy-network
    security_opt:
      - no-new-privileges:true

volumes:
  db_data:
  redis_data:

networks:
  nuvia_beauty_net:
    name: nuvia-beauty-net
  dokploy-network:
    external: true
