name: Publish Docs to GitHub Wiki

on:
  push:
    branches:
      - production
      - development
    paths:
      - "docs/**"
      - "backend-engine/docs/**"
      - "admin-panel/docs/**"
      - "vendor-portal/docs/**"
      - "storefront/docs/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: publish-wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Sync repository docs to wiki
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build wiki source tree
        shell: bash
        run: |
          rm -rf .wiki-src
          mkdir -p .wiki-src/backend-engine .wiki-src/admin-panel .wiki-src/vendor-portal .wiki-src/storefront

          cp docs/Home.md .wiki-src/Home.md
          cp docs/_Sidebar.md .wiki-src/_Sidebar.md
          cp docs/*.md .wiki-src/

          cp backend-engine/docs/*.md .wiki-src/backend-engine/
          cp admin-panel/docs/*.md .wiki-src/admin-panel/
          cp vendor-portal/docs/*.md .wiki-src/vendor-portal/
          cp storefront/docs/*.md .wiki-src/storefront/

      - name: Sync assembled docs to wiki
        shell: bash
        run: |
          wiki_url="https://github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git ls-remote "https://x-access-token:${WIKI_SYNC_SECRET}@github.com/${GITHUB_REPOSITORY}.wiki.git" HEAD >/dev/null 2>&1; then
            echo "::error::GitHub wiki is not initialized yet. Open the Wiki tab in GitHub, create the first page once, then rerun this workflow."
            echo "::error::Wiki URL checked: ${wiki_url}"
            exit 1
          fi
        env:
          WIKI_SYNC_SECRET: ${{ secrets.WIKI_SYNC_SECRET }}

      - name: Publish assembled docs to wiki
        uses: cmbrose/github-docs-to-wiki@v0.20
        with:
          githubToken: ${{ secrets.WIKI_SYNC_SECRET }}
          rootDocsFolder: .wiki-src
