name: Publish Docs to GitHub Wiki

on:
  push:
    branches:
      - production
      - development
    paths:
      - "docs/**"
      - "backend-engine/docs/**"
      - "admin-panel/docs/**"
      - "vendor-portal/docs/**"
      - "storefront/docs/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: publish-wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Sync repository docs to wiki
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build wiki source tree
        shell: bash
        run: |
          shopt -s nullglob

          rm -rf .wiki-src
          mkdir -p .wiki-src/docs .wiki-src/backend-engine .wiki-src/admin-panel .wiki-src/vendor-portal .wiki-src/storefront

          cp -a docs/. .wiki-src/docs/
          rm -rf .wiki-src/docs/.obsidian

          for doc in backend-engine/docs/*.md; do
            cp "${doc}" .wiki-src/backend-engine/
          done
          for doc in admin-panel/docs/*.md; do
            cp "${doc}" .wiki-src/admin-panel/
          done
          for doc in vendor-portal/docs/*.md; do
            cp "${doc}" .wiki-src/vendor-portal/
          done
          for doc in storefront/docs/*.md; do
            cp "${doc}" .wiki-src/storefront/
          done

          printf "%s\n\n%s\n" "# Nuvia Beauty Documentation" "See the docs section for the canonical documentation tree." > .wiki-src/Home.md

          {
            printf '# Documentation Navigation\n'
            printf '\n'
            printf '%s\n' '- [Docs](docs/)'
            printf '%s\n' '- [Backend Engine Docs](backend-engine/)'
            printf '%s\n' '- [Admin Panel Docs](admin-panel/)'
            printf '%s\n' '- [Vendor Portal Docs](vendor-portal/)'
            printf '%s\n' '- [Storefront Docs](storefront/)'
          } > .wiki-src/_Sidebar.md

      - name: Sync assembled docs to wiki
        shell: bash
        run: |
          wiki_url="https://github.com/Absolute-Martial/Nuvia-Beauty.wiki.git"
          if ! git ls-remote "https://x-access-token:${WIKI_SYNC_SECRET}@${wiki_url#https://}" HEAD >/dev/null 2>&1; then
            echo "::error::GitHub wiki is not initialized yet. Open the Wiki tab in GitHub, create the first page once, then rerun this workflow."
            echo "::error::Wiki URL checked: ${wiki_url}"
            exit 1
          fi
        env:
          WIKI_SYNC_SECRET: ${{ secrets.WIKI_SYNC_SECRET }}

      - name: Publish assembled docs to wiki
        uses: cmbrose/github-docs-to-wiki@v0.20
        with:
          githubToken: ${{ secrets.WIKI_SYNC_SECRET }}
          rootDocsFolder: .wiki-src
