name: Package and Publish Docker Images

on:
  push:
    branches:
      - development
      - production
    tags:
      - "v*"
    paths:
      - "backend-engine/**"
      - "admin-panel/**"
      - "vendor-portal/**"
      - "storefront/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc"
      - ".nvmrc"
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - "docker-compose.production.yml"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: nuvia-beauty/backend
  ADMIN_IMAGE_NAME: nuvia-beauty/admin-panel
  VENDOR_IMAGE_NAME: nuvia-beauty/vendor-portal
  STOREFRONT_IMAGE_NAME: nuvia-beauty/storefront

jobs:
  publish:
    name: Package and push GHCR images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect image rebuild scope
        id: changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            {
              echo "backend=true"
              echo "admin=true"
              echo "vendor=true"
              echo "storefront=true"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          BEFORE_SHA="${{ github.event.before }}"
          if [ -z "${BEFORE_SHA}" ] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            {
              echo "backend=true"
              echo "admin=true"
              echo "vendor=true"
              echo "storefront=true"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          mapfile -t CHANGED_FILES < <(git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}")
          backend=false
          admin=false
          vendor=false
          storefront=false

          for file in "${CHANGED_FILES[@]}"; do
            case "${file}" in
              backend-engine/*|.github/workflows/publish-images.yml)
                backend=true
                ;;
            esac

            case "${file}" in
              admin-panel/*|package.json|yarn.lock|.yarnrc|.nvmrc|.github/workflows/publish-images.yml)
                admin=true
                ;;
            esac

            case "${file}" in
              vendor-portal/*|package.json|yarn.lock|.yarnrc|.nvmrc|.github/workflows/publish-images.yml)
                vendor=true
                ;;
            esac

            case "${file}" in
              storefront/*|package.json|yarn.lock|.yarnrc|.nvmrc|.github/workflows/publish-images.yml)
                storefront=true
                ;;
            esac
          done

          {
            echo "backend=${backend}"
            echo "admin=${admin}"
            echo "vendor=${vendor}"
            echo "storefront=${storefront}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate GHCR publish token
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -z "${GHCR_TOKEN}" ]; then
            echo "::error::Missing GHCR_TOKEN repository secret. Create a GitHub token with write:packages access and add it as GHCR_TOKEN before publishing images."
            exit 1
          fi

      - name: Prepare image names
        id: images
        shell: bash
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA::12}"

          BACKEND_IMAGE="${REGISTRY}/${OWNER_LC}/${BACKEND_IMAGE_NAME}"
          ADMIN_IMAGE="${REGISTRY}/${OWNER_LC}/${ADMIN_IMAGE_NAME}"
          VENDOR_IMAGE="${REGISTRY}/${OWNER_LC}/${VENDOR_IMAGE_NAME}"
          STOREFRONT_IMAGE="${REGISTRY}/${OWNER_LC}/${STOREFRONT_IMAGE_NAME}"

          {
            echo "owner_lc=${OWNER_LC}"
            echo "short_sha=${SHORT_SHA}"
            echo "backend_image=${BACKEND_IMAGE}"
            echo "admin_image=${ADMIN_IMAGE}"
            echo "vendor_image=${VENDOR_IMAGE}"
            echo "storefront_image=${STOREFRONT_IMAGE}"
            echo "backend_sha_ref=${BACKEND_IMAGE}:sha-${SHORT_SHA}"
            echo "admin_sha_ref=${ADMIN_IMAGE}:sha-${SHORT_SHA}"
            echo "vendor_sha_ref=${VENDOR_IMAGE}:sha-${SHORT_SHA}"
            echo "storefront_sha_ref=${STOREFRONT_IMAGE}:sha-${SHORT_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME || github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract backend image metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        if: steps.changed.outputs.backend == 'true'
        with:
          images: ${{ steps.images.outputs.backend_image }}
          labels: |
            org.opencontainers.image.title=Nuvia Beauty Backend
            org.opencontainers.image.description=Laravel backend for Nuvia Beauty
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch }}

      - name: Extract admin image metadata
        id: meta-admin
        uses: docker/metadata-action@v5
        if: steps.changed.outputs.admin == 'true'
        with:
          images: ${{ steps.images.outputs.admin_image }}
          labels: |
            org.opencontainers.image.title=Nuvia Beauty Admin Panel
            org.opencontainers.image.description=Private admin panel for Nuvia Beauty
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch }}

      - name: Extract vendor image metadata
        id: meta-vendor
        uses: docker/metadata-action@v5
        if: steps.changed.outputs.vendor == 'true'
        with:
          images: ${{ steps.images.outputs.vendor_image }}
          labels: |
            org.opencontainers.image.title=Nuvia Beauty Vendor Portal
            org.opencontainers.image.description=Vendor portal for Nuvia Beauty
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch }}

      - name: Extract storefront image metadata
        id: meta-storefront
        uses: docker/metadata-action@v5
        if: steps.changed.outputs.storefront == 'true'
        with:
          images: ${{ steps.images.outputs.storefront_image }}
          labels: |
            org.opencontainers.image.title=Nuvia Beauty Storefront
            org.opencontainers.image.description=Customer storefront for Nuvia Beauty
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        if: steps.changed.outputs.backend == 'true'
        with:
          context: ./backend-engine
          file: ./backend-engine/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend-publish
          cache-to: type=gha,mode=max,scope=backend-publish

      - name: Build and push admin image
        uses: docker/build-push-action@v6
        if: steps.changed.outputs.admin == 'true'
        with:
          context: .
          file: ./admin-panel/Dockerfile
          push: true
          tags: ${{ steps.meta-admin.outputs.tags }}
          labels: ${{ steps.meta-admin.outputs.labels }}
          cache-from: type=gha,scope=admin-publish
          cache-to: type=gha,mode=max,scope=admin-publish

      - name: Build and push vendor image
        uses: docker/build-push-action@v6
        if: steps.changed.outputs.vendor == 'true'
        with:
          context: .
          file: ./vendor-portal/Dockerfile
          push: true
          tags: ${{ steps.meta-vendor.outputs.tags }}
          labels: ${{ steps.meta-vendor.outputs.labels }}
          cache-from: type=gha,scope=vendor-publish
          cache-to: type=gha,mode=max,scope=vendor-publish

      - name: Build and push storefront image
        uses: docker/build-push-action@v6
        if: steps.changed.outputs.storefront == 'true'
        with:
          context: .
          file: ./storefront/Dockerfile
          push: true
          tags: ${{ steps.meta-storefront.outputs.tags }}
          labels: ${{ steps.meta-storefront.outputs.labels }}
          cache-from: type=gha,scope=storefront-publish
          cache-to: type=gha,mode=max,scope=storefront-publish

      - name: Validate compose with published image refs
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_URL: https://api.example.test
          FRONTEND_URL: https://shop.example.test
          ADMIN_URL: https://admin.example.test
          VENDOR_URL: https://vendor.example.test
          DB_PASSWORD: ci-placeholder-password
          DB_ROOT_PASSWORD: ci-placeholder-root-password
          AISTOR_PUBLIC_URL: https://assets.example.test/nuvia-public
          AISTOR_DATA_DIR: /tmp/nuvia/aistor/data
          AISTOR_CERTS_DIR: /tmp/nuvia/aistor/certs
          AISTOR_LICENSE_FILE: /tmp/nuvia/aistor/license/minio.license
          AISTOR_ROOT_USER_FILE: /tmp/nuvia/aistor/secrets/root_user
          AISTOR_ROOT_PASSWORD_FILE: /tmp/nuvia/aistor/secrets/root_password
          CLOUDFLARE_TUNNEL_TOKEN: ci-placeholder-token
          NUVIA_BACKEND_IMAGE: ${{ steps.images.outputs.backend_sha_ref }}
          NUVIA_ADMIN_IMAGE: ${{ steps.images.outputs.admin_sha_ref }}
          NUVIA_VENDOR_IMAGE: ${{ steps.images.outputs.vendor_sha_ref }}
          NUVIA_STOREFRONT_IMAGE: ${{ steps.images.outputs.storefront_sha_ref }}
          NEXT_PUBLIC_REST_API_ENDPOINT: https://api.example.test
          NEXT_PUBLIC_SITE_URL: https://shop.example.test
          NEXT_PUBLIC_SHOP_URL: https://shop.example.test
          NEXT_PUBLIC_VENDOR_URL: https://vendor.example.test
        run: docker compose -f docker-compose.production.yml config > /tmp/nuvia-beauty.compose.rendered.yml

      - name: Publish image summary
        shell: bash
        run: |
          {
            echo "## Published Nuvia Beauty images"
            echo
            echo "Backend image:"
            echo '```text'
            if [ "${{ steps.changed.outputs.backend }}" = "true" ]; then echo "${{ steps.images.outputs.backend_image }}"; else echo "Skipped"; fi
            echo '```'
            echo
            echo "Admin image:"
            echo '```text'
            if [ "${{ steps.changed.outputs.admin }}" = "true" ]; then echo "${{ steps.images.outputs.admin_image }}"; else echo "Skipped"; fi
            echo '```'
            echo
            echo "Vendor image:"
            echo '```text'
            if [ "${{ steps.changed.outputs.vendor }}" = "true" ]; then echo "${{ steps.images.outputs.vendor_image }}"; else echo "Skipped"; fi
            echo '```'
            echo
            echo "Storefront image:"
            echo '```text'
            if [ "${{ steps.changed.outputs.storefront }}" = "true" ]; then echo "${{ steps.images.outputs.storefront_image }}"; else echo "Skipped"; fi
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
