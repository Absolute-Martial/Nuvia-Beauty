name: CI

on:
  push:
    branches: [production, development, "features/**"]
  pull_request:
    branches: [production, development]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-lint:
    name: GitHub Actions workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install actionlint
        shell: bash
        run: |
          ACTIONLINT_REF="v1.7.9"
          ACTIONLINT_VERSION="${ACTIONLINT_REF#v}"
          curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/${ACTIONLINT_REF}/scripts/download-actionlint.bash" -o /tmp/download-actionlint.bash
          mkdir -p "${HOME}/.local/bin"
          bash /tmp/download-actionlint.bash "${ACTIONLINT_VERSION}" "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Run actionlint
        run: actionlint

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: [workflow-lint]
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, exif, gd, intl, mbstring, pdo_mysql, sqlite, xml, zip
          coverage: none
          tools: composer

      - name: Validate composer
        working-directory: backend-engine
        run: composer validate --no-check-all --strict

      - name: Install dependencies
        working-directory: backend-engine
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests
        working-directory: backend-engine
        run: php artisan test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    needs: [workflow-lint]
    env:
      APPLICATION_MODE: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_REST_API_ENDPOINT: http://localhost
      NEXT_PUBLIC_SHOP_URL: http://localhost:3003
      NEXT_PUBLIC_AUTH_TOKEN_KEY: AUTH_CRED
      NEXT_PUBLIC_DEFAULT_LANGUAGE: en
      NEXT_PUBLIC_ENABLE_MULTI_LANG: "false"
      NEXT_PUBLIC_AVAILABLE_LANGUAGES: en
      REVALIDATE_DURATION: "120"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Cache Next.js build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/admin-panel/.next/cache
            ${{ github.workspace }}/vendor-portal/.next/cache
            ${{ github.workspace }}/storefront/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('yarn.lock') }}-${{ hashFiles('admin-panel/**/*.js', 'admin-panel/**/*.jsx', 'admin-panel/**/*.ts', 'admin-panel/**/*.tsx', 'vendor-portal/**/*.js', 'vendor-portal/**/*.jsx', 'vendor-portal/**/*.ts', 'vendor-portal/**/*.tsx', 'storefront/**/*.js', 'storefront/**/*.jsx', 'storefront/**/*.ts', 'storefront/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('yarn.lock') }}-

      - name: Install dependencies
        run: yarn install

      - name: Lint admin
        run: yarn workspace @nuvia/admin-panel lint

      - name: Lint vendor
        run: yarn workspace @nuvia/vendor-portal lint

      - name: Lint storefront
        run: yarn workspace @nuvia/storefront lint

      - name: Build admin
        run: yarn build:admin-panel

      - name: Build vendor
        run: yarn build:vendor-portal

      - name: Build storefront
        run: yarn build:storefront

  compose:
    name: Compose config validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: https://api.example.test
      FRONTEND_URL: https://shop.example.test
      ADMIN_URL: https://admin.example.test
      VENDOR_URL: https://vendor.example.test
      DB_PASSWORD: ci-nuvia-password
      DB_ROOT_PASSWORD: ci-nuvia-root-password
      AISTOR_PUBLIC_URL: https://assets.example.test/nuvia-public
      AISTOR_DATA_DIR: /tmp/nuvia/aistor/data
      AISTOR_CERTS_DIR: /tmp/nuvia/aistor/certs
      AISTOR_LICENSE_FILE: /tmp/nuvia/aistor/license/minio.license
      AISTOR_ROOT_USER_FILE: /tmp/nuvia/aistor/secrets/root_user
      AISTOR_ROOT_PASSWORD_FILE: /tmp/nuvia/aistor/secrets/root_password
      CLOUDFLARE_TUNNEL_TOKEN: ci-placeholder-token
      NUVIA_BACKEND_IMAGE: ghcr.io/absolute-martial/nuvia-beauty/backend:development
      NUVIA_ADMIN_IMAGE: ghcr.io/absolute-martial/nuvia-beauty/admin-panel:development
      NUVIA_VENDOR_IMAGE: ghcr.io/absolute-martial/nuvia-beauty/vendor-portal:development
      NUVIA_STOREFRONT_IMAGE: ghcr.io/absolute-martial/nuvia-beauty/storefront:development
      NEXT_PUBLIC_REST_API_ENDPOINT: https://api.example.test
      NEXT_PUBLIC_SITE_URL: https://shop.example.test
      NEXT_PUBLIC_SHOP_URL: https://shop.example.test
      NEXT_PUBLIC_VENDOR_URL: https://vendor.example.test
    steps:
      - uses: actions/checkout@v6

      - name: Validate base compose
        run: docker compose config >/dev/null

      - name: Validate dev compose
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config >/dev/null

      - name: Validate production compose
        run: docker compose -f docker-compose.production.yml config >/dev/null

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: step-security/gitleaks-action@v2.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: ""
        continue-on-error: true
