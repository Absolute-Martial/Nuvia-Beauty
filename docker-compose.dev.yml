services:
  db:
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"

  aistor:
    image: minio/minio:latest
    entrypoint:
      - /bin/sh
      - -c
      - >
        export MINIO_ROOT_USER="$$(cat /run/secrets/root_user)" &&
        export MINIO_ROOT_PASSWORD="$$(cat /run/secrets/root_password)" &&
        minio server /mnt/data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ${AISTOR_DEV_DATA_DIR:-./docker/aistor/dev/minio-data}:/mnt/data
      - ${AISTOR_DEV_CERTS_DIR:-./docker/aistor/dev/certs}:/etc/minio/certs
      - ${AISTOR_DEV_ROOT_USER_FILE:-./docker/aistor/dev/root_user}:/run/secrets/root_user:ro
      - ${AISTOR_DEV_ROOT_PASSWORD_FILE:-./docker/aistor/dev/root_password}:/run/secrets/root_password:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - nuvia_beauty_net

  aistor-setup:
    image: minio/mc:latest
    depends_on:
      aistor:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://aistor:9000 "$$(cat /run/secrets/root_user)" "$$(cat /run/secrets/root_password)" &&
        mc mb --ignore-existing local/${S3_PUBLIC_BUCKET:-${AISTOR_BUCKET:-nuvia-public}} &&
        mc mb --ignore-existing local/${S3_BEAUTY_INPUTS_BUCKET:-nuvia-private-beauty-inputs} &&
        mc mb --ignore-existing local/${S3_BEAUTY_RESULTS_BUCKET:-nuvia-private-beauty-results} &&
        mc mb --ignore-existing local/${S3_BEAUTY_CALIBRATION_BUCKET:-nuvia-private-calibration} &&
        mc anonymous set download local/${S3_PUBLIC_BUCKET:-${AISTOR_BUCKET:-nuvia-public}}
    volumes:
      - ${AISTOR_DEV_ROOT_USER_FILE:-./docker/aistor/dev/root_user}:/run/secrets/root_user:ro
      - ${AISTOR_DEV_ROOT_PASSWORD_FILE:-./docker/aistor/dev/root_password}:/run/secrets/root_password:ro
    restart: "no"
    networks:
      - nuvia_beauty_net

  backend:
    build:
      context: ./backend-engine
      dockerfile: Dockerfile
      network: host
    depends_on:
      aistor:
        condition: service_healthy
      aistor-setup:
        condition: service_completed_successfully
    environment:
      APP_ENV: local
      DB_SOCKET: ""
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3_compatible}
      S3_PROVIDER: ${S3_PROVIDER:-minio_aistor}
      S3_ENDPOINT: http://aistor:9000
      S3_REGION: ${S3_REGION:-${AISTOR_REGION:-us-east-1}}
      S3_USE_PATH_STYLE_ENDPOINT: "true"
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-${AISTOR_BUCKET:-nuvia-public}}
      S3_BEAUTY_INPUTS_BUCKET: ${S3_BEAUTY_INPUTS_BUCKET:-nuvia-private-beauty-inputs}
      S3_BEAUTY_RESULTS_BUCKET: ${S3_BEAUTY_RESULTS_BUCKET:-nuvia-private-beauty-results}
      S3_BEAUTY_CALIBRATION_BUCKET: ${S3_BEAUTY_CALIBRATION_BUCKET:-nuvia-private-calibration}
      FILESYSTEM_DISK: s3
      FILESYSTEM_CLOUD: s3
      MEDIA_DISK: s3
      IMPORT_FILESYSTEM_DISK: s3
      AISTOR_REGION: ${AISTOR_REGION:-us-east-1}
      AISTOR_BUCKET: ${AISTOR_BUCKET:-nuvia-public}
      AISTOR_ENDPOINT: http://aistor:9000
      AISTOR_PUBLIC_URL: http://localhost:9000/${AISTOR_BUCKET:-nuvia-public}
      AISTOR_USE_PATH_STYLE_ENDPOINT: "true"
      AISTOR_BUCKET_ENDPOINT: "false"
    command:
      - /bin/sh
      - -c
      - >
        export S3_ACCESS_KEY_ID="$$(cat /run/secrets/root_user)";
        export S3_SECRET_ACCESS_KEY="$$(cat /run/secrets/root_password)";
        export AISTOR_ACCESS_KEY_ID="$$(cat /run/secrets/root_user)";
        export AISTOR_SECRET_ACCESS_KEY="$$(cat /run/secrets/root_password)";
        php artisan serve --host 0.0.0.0 --port 8000
    volumes:
      - ./backend-engine:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - ${AISTOR_DEV_ROOT_USER_FILE:-./docker/aistor/dev/root_user}:/run/secrets/root_user:ro
      - ${AISTOR_DEV_ROOT_PASSWORD_FILE:-./docker/aistor/dev/root_password}:/run/secrets/root_password:ro
    networks:
      - nuvia_beauty_net

  admin:
    build:
      context: .
      dockerfile: admin-panel/Dockerfile
      network: host
    command: yarn dev
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - admin_node_modules:/app/node_modules
    networks:
      - nuvia_beauty_net

  vendor:
    build:
      context: .
      dockerfile: vendor-portal/Dockerfile
      network: host
    command: yarn dev
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - vendor_node_modules:/app/node_modules
    networks:
      - nuvia_beauty_net

  storefront:
    build:
      context: .
      dockerfile: storefront/Dockerfile
      network: host
    command: yarn dev
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - storefront_node_modules:/app/node_modules
    networks:
      - nuvia_beauty_net

volumes:
  backend_vendor:
  admin_node_modules:
  vendor_node_modules:
  storefront_node_modules:

networks:
  nuvia_beauty_net:
    name: nuvia-beauty-net
